<app-header />

<main>
    <ul id="users">
        @for (user of usersList; track user.id) {
        <li>
            <app-user [user]="user" (selectUser)="onUserSelected($event)" />
        </li>
        }
    </ul>

    @if(selectedUser) {
        <app-tasks [name]="selectedUser.name" [userId]="selectedUser.id" />
    } @else {
        <h2>Please select a user to view their tasks.</h2>
    }
</main>
