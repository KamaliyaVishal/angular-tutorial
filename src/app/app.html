<app-header />

<main>
    <ul id="users">
        <li>
            @for (user of usersList; track user.id) {
            <app-user [user]="user" (selectUser)="onUserSelected($event)" />
            }
        </li>
    </ul>

    <app-tasks [name]="selectedUser? selectedUser.name : undefined" />
</main>
